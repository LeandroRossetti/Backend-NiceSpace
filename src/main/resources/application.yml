spring:
  application:
    name: cowork-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cowork}
    username: ${DB_USERNAME:cowork}
    password: ${DB_PASSWORD:cowork}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sobrescribir en produccion mediante variable de entorno APP_JWT_SECRET (minimo 32 bytes)
    secret: ${APP_JWT_SECRET:cowork-super-secret-key-change-me-in-production-0123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  google:
    # OAuth 2.0 Web Client ID. Blank disables Google login.
    client-id: ${APP_GOOGLE_CLIENT_ID:}
