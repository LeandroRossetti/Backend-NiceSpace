spring:
  application:
    name: cowork-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cowork}
    username: ${DB_USERNAME:cowork}
    password: ${DB_PASSWORD:cowork}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 35MB
      max-request-size: 35MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sobrescribir en produccion mediante variable de entorno APP_JWT_SECRET (minimo 32 bytes)
    secret: ${APP_JWT_SECRET:cowork-super-secret-key-change-me-in-production-0123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  google:
    # OAuth 2.0 Web Client ID. Blank disables Google login.
    client-id: ${APP_GOOGLE_CLIENT_ID:}
  imgbb:
    # API key de imgbb.com para subir imágenes de las sedes. Blank deshabilita la subida.
    api-key: ${IMGBB_API_KEY:}
  mercadopago:
    # Access token de prueba (sandbox). Blank deshabilita los pagos.
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  mail:
    # Envío de mails transaccionales con Gmail SMTP. Blank deshabilita el envío.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  # URL pública del frontend usada como back_url de Mercado Pago.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
